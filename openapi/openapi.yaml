openapi: 3.1.2

info:
  title: OpenAPI API Contract Starter
  version: 0.1.0
  description: |
    A practical, modular OpenAPI foundation for designing
    and evolving HTTP API contracts.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://{environment}.api.your-domain.com
    description: Local development
    variables:
      environment:
        default: dev
        enum:
          - dev
          - staging
          - production
        description: Target API server
components:
  securitySchemes:
    bearerAuth:
      $ref: ./components/security/bearer-auth.yaml
tags:
  - name: Health
    description: Service health operations

paths:
  /health:
    $ref: ./paths/health.yaml

  /users:
    $ref: ./paths/users.yaml

  /users/{userId}:
    $ref: ./paths/user-by-id.yaml

security:
  - bearerAuth: []
